name: OrigamiVPN build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: origami-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'origami-v1'
          key: ${{ matrix.target }}
          workspaces: |
            . -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: 'pnpm'

      - name: Install dependencies and sidecars
        run: |
          pnpm i --frozen-lockfile
          pnpm run prebuild ${{ matrix.target }}

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OrigamiVPN ${{ github.ref_name }}'
          releaseBody: 'OrigamiVPN desktop client.'
          releaseDraft: true
          prerelease: false
          tauriScript: pnpm
          args: --target ${{ matrix.target }}

      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}

      # Also on tags: the Arch package below repackages the .deb from here.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: origamivpn-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm

  arch:
    name: Package for Arch Linux
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the Linux build
        uses: actions/download-artifact@v7
        with:
          name: origamivpn-x86_64-unknown-linux-gnu
          path: linux

      - name: Build the package
        run: |
          VERSION=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' src-tauri/tauri.conf.json)
          useradd -m builder
          mkdir /tmp/pkg
          cp src-tauri/packages/arch/PKGBUILD src-tauri/packages/arch/origamivpn.install /tmp/pkg/
          cp "linux/deb/OrigamiVPN_${VERSION}_amd64.deb" /tmp/pkg/
          chown -R builder /tmp/pkg
          cd /tmp/pkg && sudo -u builder env ORIGAMI_VERSION="$VERSION" makepkg --nodeps --noconfirm
          ls -la /tmp/pkg/*.pkg.tar.zst

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: origamivpn-arch
          if-no-files-found: error
          retention-days: 14
          path: /tmp/pkg/*.pkg.tar.zst

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pacman -Sy --noconfirm --needed github-cli
          gh release upload "$GITHUB_REF_NAME" /tmp/pkg/*.pkg.tar.zst --clobber -R "$GITHUB_REPOSITORY"

  latest-json:
    name: Fix update links
    needs: [build, arch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Point latest.json at the published downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The notes for a version live in .github/release-notes/<tag>.md: they go into latest.json for
        # the update dialog and into the release page. Without the file both keep the stock text.
        run: |
          gh release download "$GITHUB_REF_NAME" -p latest.json -D draft -R "$GITHUB_REPOSITORY"
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          [[ -f $notes ]] || notes=''
          scripts/origami-fix-latest-json.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" draft/latest.json latest.json "$notes"
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber -R "$GITHUB_REPOSITORY"
          if [[ -n $notes ]]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes" -R "$GITHUB_REPOSITORY"
          fi
